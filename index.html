<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Practice</title>
<style>
  :root {
    --teal: #1F5C5C; --offwhite: #FAF7F2; --amber: #E8A33D; --charcoal: #2B2B2B;
    --sage: #A8C5A0; --terracotta: #C97B63; --sand: #EFE8DC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--offwhite); color: var(--charcoal); line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { color: var(--teal); font-size: 1.6rem; margin-bottom: 4px; }
  .sub { margin-top: 0; opacity: 0.75; }
  .card { background: var(--sand); border-radius: 12px; padding: 18px; margin: 18px 0; }
  label { display: block; font-weight: bold; margin: 14px 0 6px; color: var(--teal); }
  label:first-child { margin-top: 0; }
  select, textarea, input[type=number] { width: 100%; font: inherit; padding: 10px; border: 1px solid #cfc6b5; border-radius: 8px; background: #fff; }
  textarea { min-height: 120px; resize: vertical; }
  button { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
  button.secondary { background: var(--amber); color: var(--charcoal); }
  button:disabled { opacity: 0.5; cursor: default; }
  .progress { color: var(--teal); font-weight: bold; }
  .feedback { border-left: 4px solid var(--sage); padding: 8px 12px; margin-top: 12px; background: #fff; border-radius: 6px; }
  .note { font-size: 0.85rem; opacity: 0.75; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Interview Practice</h1>
  <p class="sub">Answer in your own words. Keep it to the point.</p>

  <!-- SETUP -->
  <div id="setup" class="card">
    <label for="field">Choose your field</label>
    <select id="field">
      <option>Finance</option>
      <option>HR</option>
      <option>Marketing</option>
      <option>Product management</option>
      <option>International business</option>
      <option>General</option>
      <option>Other</option>
    </select>
    <label for="count">How many questions? (5 to 25)</label>
    <input id="count" type="number" min="5" max="25" value="10">
    <button id="startBtn">Start practice</button>
  </div>

  <!-- PRACTICE -->
  <div id="practice" class="hidden">
    <p class="progress" id="counter"></p>
    <div class="card"><p id="question" style="font-size:1.1rem;margin:0;"></p></div>
    <p class="note" id="aiNote"></p>
    <label for="answer">Your answer</label>
    <textarea id="answer" placeholder="Type your answer here..."></textarea>
    <button id="submitBtn">Submit answer</button>
    <div id="feedback" class="feedback hidden"></div>
    <div id="finishArea" class="hidden">
      <button id="finishBtn" class="secondary">See my report</button>
    </div>
  </div>

  <!-- REPORT -->
  <div id="report" class="card hidden">
    <h2 style="color:var(--teal);margin-top:0;">Your session report</h2>
    <p id="summary"></p>
    <p><strong>Focus next:</strong> <span id="focus"></span></p>
    <p><strong>Your next step:</strong> <span id="nextStep"></span></p>
    <button id="retryBtn" class="secondary">Try again</button>
    <button id="homeBtn">Back to home</button>
  </div>

</div>

<script>
  const OPENING = "What describes you the most?";

  const FIELD_QUESTIONS = {
    "Finance": [
      "Tell me about a time you worked with numbers to make a decision.",
      "How would you read a company's profit and loss statement?",
      "How would you explain a budget variance to someone with no finance background?"
    ],
    "HR": [
      "Tell me about a time you resolved a conflict in a team.",
      "How would you handle an employee who keeps missing deadlines?",
      "What makes a hiring process fair, in your view?"
    ],
    "Marketing": [
      "Tell me about a campaign you planned or would like to plan.",
      "How would you decide which channel to spend money on?",
      "How do you measure whether a marketing campaign worked?"
    ],
    "Product management": [
      "Tell me about a product you use often and what you would improve.",
      "How would you decide which feature to build first?",
      "How do you know when a product is ready to launch?"
    ],
    "International business": [
      "Tell me about a time you worked with people from another culture.",
      "What would you check before entering a new country's market?",
      "How would you handle a delay caused by customs or shipping?"
    ],
    "General": [
      "Tell me about a goal you set for yourself and how you reached it.",
      "Describe a decision you made under pressure.",
      "What is one thing you would do differently in your last job or studies?"
    ],
    "Other": [
      "Tell me about the work you want to do in your field.",
      "What is one skill you have built that matters for this work?",
      "Describe a challenge you faced in this area and how you handled it."
    ]
  };

  // Used only if the AI helper is unavailable
  const FALLBACK_FOLLOWUPS = [
    "What was the hardest part of that?",
    "Can you give me a specific example?",
    "What was the result, and how did you measure it?",
    "Why did you choose that approach over another?"
  ];

  let field = "General", total = 10, current = "", answers = [], busy = false;

  const $ = id => document.getElementById(id);
  const pick = list => list[Math.floor(Math.random() * list.length)];

  function feedbackFor(text) {
    const words = text.trim().split(/\s+/).length;
    const tips = [];
    if (words < 15) tips.push("Give a little more detail, such as an example or a result.");
    if (words > 60) tips.push("Stay on point. Lead with the main answer, then add one example.");
    if (!/\b(I|my|we)\b/i.test(text)) tips.push("Use 'I' to say what you did. Interviewers want your own actions.");
    if (/\b(always|never|best|perfect|guarantee)\b/i.test(text)) tips.push("Avoid absolute claims unless you can back them up.");
    if (tips.length === 0) tips.push("Good. Keep the same clear structure in the next answer.");
    return tips;
  }

  async function getFollowUp(lastAnswer) {
    try {
      const res = await fetch("/.netlify/functions/followup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          field,
          lastAnswer,
          history: answers.slice(-6).map(a => ({ question: a.question, answer: a.answer }))
        })
      });
      const data = await res.json();
      if (res.ok && data.followUp) return { text: data.followUp, ai: true };
    } catch (e) { /* fall through */ }
    return { text: pick(FALLBACK_FOLLOWUPS), ai: false };
  }

  function showQuestion(text, ai) {
    current = text;
    $("question").textContent = text;
    $("counter").textContent = "Question " + (answers.length + 1) + " of " + total;
    $("aiNote").textContent = ai === false ? "AI is unavailable right now, so a standard question is shown." : "";
    $("answer").value = "";
  }

  function setBusy(on) {
    busy = on;
    $("submitBtn").disabled = on;
    $("submitBtn").textContent = on ? "Thinking..." : "Submit answer";
  }

  // ---- Events ----
  $("startBtn").onclick = () => {
    field = $("field").value;
    total = Math.min(25, Math.max(5, parseInt($("count").value) || 10));
    answers = [];
    $("setup").classList.add("hidden");
    $("report").classList.add("hidden");
    $("finishArea").classList.add("hidden");
    $("submitBtn").classList.remove("hidden");
    $("answer").classList.remove("hidden");
    $("practice").classList.remove("hidden");
    $("feedback").classList.add("hidden");
    showQuestion(OPENING, true);
  };

  $("submitBtn").onclick = async () => {
    if (busy) return;
    const text = $("answer").value.trim();
    if (!text) { alert("Please type an answer first."); return; }

    answers.push({ question: current, answer: text });

    const tips = feedbackFor(text);
    let html = "";
    if (text.split(/\s+/).length > 60) {
      html += "<p>That's a lot of detail. In short: " + text.split(/\s+/).slice(0, 25).join(" ") + "...</p>";
    }
    html += "<ul>" + tips.map(t => "<li>" + t + "</li>").join("") + "</ul>";
    $("feedback").innerHTML = html;
    $("feedback").classList.remove("hidden");

    // Finished: show the button to open the report (no timer)
    if (answers.length >= total) {
      $("answer").value = "";
      $("question").textContent = "You've answered all " + total + " questions.";
      $("counter").textContent = "Done";
      $("aiNote").textContent = "";
      $("submitBtn").classList.add("hidden");
      $("answer").classList.add("hidden");
      $("finishArea").classList.remove("hidden");
      return;
    }

    setBusy(true);
    let next;
    if (answers.length % 2 === 1) {
      // Odd count: a follow-up on the last answer
      next = await getFollowUp(text);
    } else {
      // Even count: a field question
      next = { text: pick(FIELD_QUESTIONS[field]), ai: true };
    }
    showQuestion(next.text, next.ai);
    setBusy(false);
  };

  $("finishBtn").onclick = () => {
    $("practice").classList.add("hidden");
    $("report").classList.remove("hidden");
    const words = answers.map(a => a.answer.split(/\s+/).length);
    const longest = Math.max(...words), shortest = Math.min(...words);
    $("summary").textContent = "You answered " + answers.length + " questions in " + field + ". Your longest answer was " + longest + " words and your shortest was " + shortest + ".";
    $("focus").textContent = "Check that each answer has one clear example and one result.";
    $("nextStep").textContent = "Try one answer again, and end it with a specific result.";
  };

  $("retryBtn").onclick = () => {
    answers = [];
    $("report").classList.add("hidden");
    $("finishArea").classList.add("hidden");
    $("answer").classList.remove("hidden");
    $("submitBtn").classList.remove("hidden");
    $("practice").classList.remove("hidden");
    $("feedback").classList.add("hidden");
    showQuestion(OPENING, true);
  };

  $("homeBtn").onclick = () => {
    $("report").classList.add("hidden");
    $("practice").classList.add("hidden");
    $("answer").classList.remove("hidden");
    $("setup").classList.remove("hidden");
  };
</script>
</body>
</html>
