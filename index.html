<title>Interview Practice</title>
<style>
  :root {
    --teal: #1F5C5C; --offwhite: #FAF7F2; --amber: #E8A33D; --charcoal: #2B2B2B;
    --sage: #A8C5A0; --terracotta: #C97B63; --sand: #EFE8DC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--offwhite); color: var(--charcoal); line-height: 1.6; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { color: var(--teal); font-size: 1.6rem; margin-bottom: 4px; }
  h2 { color: var(--teal); font-size: 1.2rem; margin: 22px 0 6px; }
  .sub { margin-top: 0; opacity: 0.75; }
  .card { background: var(--sand); border-radius: 12px; padding: 18px; margin: 18px 0; }
  label { display: block; font-weight: bold; margin: 14px 0 6px; color: var(--teal); }
  select, input[type=number] { width: 100%; font: inherit; padding: 10px; border: 1px solid #cfc6b5; border-radius: 8px; background: #fff; }
  button { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font: inherit; cursor: pointer; margin: 10px 8px 0 0; }
  button.secondary { background: var(--amber); color: var(--charcoal); }
  button:disabled { opacity: 0.45; cursor: default; }
  .status { font-weight: bold; color: var(--teal); }
